name: Daily

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      artifacts:
        description: Number of HTML artifacts (0 to 4)
        default: '1'
      force:
        description: Replace today's results
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for API key
        id: key
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Add the OPENROUTER_API_KEY secret to enable daily runs."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Run today's team
        if: steps.key.outputs.ok == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ vars.MODEL }}
          API_URL: ${{ vars.API_URL }}
          TZ: ${{ vars.TZ || 'UTC' }}
          ARTIFACTS: ${{ inputs.artifacts || vars.ARTIFACTS || '1' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: node run.mjs $FORCE
      - name: Commit results
        if: always() && steps.key.outputs.ok == 'true'
        run: |
          if [ ! -d days ]; then echo "No results."; exit 0; fi
          git add days
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Daily team $(TZ="${TZ:-UTC}" date +%Y-%m-%d)"
          git push
        env:
          TZ: ${{ vars.TZ || 'UTC' }}
